name: Quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Validate JSON contracts and Python regressions
        run: |
          python3 scripts/validate_schema.py
          python3 scripts/validate_data.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve the accepted data baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          baseline="$PR_BASE_SHA"
          if [[ -z "$baseline" && "$EVENT_NAME" == 'push' ]]; then
            baseline="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$baseline" && "$EVENT_NAME" == 'workflow_dispatch' && "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            baseline="origin/$DEFAULT_BRANCH"
          fi
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline="$CURRENT_SHA"
          fi
          git rev-parse --verify "${baseline}^{commit}" >/dev/null
          echo "ref=$baseline" >> "$GITHUB_OUTPUT"

      - name: Guard generated data against the accepted baseline
        run: python3 scripts/check_data_diff.py --baseline-ref "${{ steps.baseline.outputs.ref }}"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run calculation and collection unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser regressions
        run: npm run test:browser

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble the static site only
        shell: bash
        run: |
          mkdir -p _site/data _site/schemas
          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' \
               -o -name '*.png' -o -name '*.ico' -o -name '*.webmanifest' -o -name '.nojekyll' \) \
            -exec cp {} _site/ \;
          find data -maxdepth 1 -type f -name '*.json' -exec cp {} _site/data/ \;
          find schemas -maxdepth 1 -type f -name '*.json' -exec cp {} _site/schemas/ \;
          test -s _site/schemas/pokemon.schema.json
          test -s _site/schemas/pvp.schema.json

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
