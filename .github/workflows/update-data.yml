name: Update Pokemon data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 0'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact data snapshot
        run: python3 scripts/update_data.py
      - name: Validate generated JSON
        run: python3 scripts/validate_data.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/pokemon.json data/pvp.json
          git diff --cached --quiet || git commit -m "chore: update Pokemon data"
          git push
