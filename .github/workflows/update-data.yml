name: Propose weekly Pokemon data update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * 0'

# The bot may update only its dedicated branch and open a reviewable PR. It
# never pushes main and never enables auto-merge.
permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: weekly-pokemon-data-update
  cancel-in-progress: false

env:
  UPDATE_BRANCH: automation/weekly-data-update

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install validation and browser-test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Build compact data snapshot
        run: python3 scripts/update_data.py

      - name: Validate generated data contracts
        run: |
          python3 scripts/validate_schema.py
          python3 scripts/validate_data.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Guard against suspicious upstream data loss
        run: python3 scripts/check_data_diff.py --baseline-ref HEAD

      - name: Run JavaScript and browser regressions
        run: |
          npm run test:mechanics
          npm run test:browser

      - name: Detect snapshot changes
        id: changes
        shell: bash
        run: |
          substantive="$(python3 scripts/check_data_diff.py \
            --baseline-ref HEAD \
            --substantive-status)"
          if [[ "$substantive" == 'false' ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No substantive data changes were found (refresh timestamps are ignored)."
          elif [[ "$substantive" != 'true' ]]; then
            echo "Unexpected substantive-change status: $substantive" >&2
            exit 2
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            artifact_dir="${RUNNER_TEMP}/weekly-data-update"
            mkdir -p "$artifact_dir/data"
            git diff --binary -- data/pokemon.json data/pvp.json > "$artifact_dir/data-update.patch"
            cp data/pokemon.json data/pvp.json "$artifact_dir/data/"
          fi

      - name: Publish the reviewed bot branch
        id: publish
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -u
          published=false
          head_sha=''

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/pokemon.json data/pvp.json

          if ! git commit -m "chore(data): propose weekly snapshot $(date -u +%F)"; then
            echo "::error::Could not create the data-update commit; the fallback artifact will be uploaded."
          else
            head_sha="$(git rev-parse HEAD)"
            remote_line="$(git ls-remote --heads origin "refs/heads/${UPDATE_BRANCH}" | head -n 1)"
            if [[ -n "$remote_line" ]]; then
              expected_sha="${remote_line%%[[:space:]]*}"
            else
              expected_sha=''
            fi

            # An explicit lease prevents a concurrent writer from being
            # overwritten between the remote check and this bot-only update.
            if git push \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${expected_sha}" \
              origin "HEAD:refs/heads/${UPDATE_BRANCH}"; then
              published=true
            else
              echo "::error::Could not publish the bot branch; the fallback artifact will be uploaded."
            fi
          fi

          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Create or update the review PR
        id: propose_pr
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          failed=false
          pr_url=''
          title='chore(data): weekly Pokemon snapshot update'
          body_file="${RUNNER_TEMP}/weekly-data-pr.md"
          payload_file="${RUNNER_TEMP}/weekly-data-pr.json"

          cat > "$body_file" <<'EOF'
          ## Automated data update

          This PR was generated from the current upstream snapshots and passed:

          - JSON Schema and semantic data validation
          - mutation-tested data-loss guard against `main`
          - mechanics and desktop/mobile Playwright regressions

          Review the data diff before merging. This workflow does **not** auto-merge.

          EOF
          printf '\nSource run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body_file"

          set +e
          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$UPDATE_BRANCH" \
            --base main \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          list_status=$?

          if [[ $list_status -ne 0 ]]; then
            failed=true
          elif [[ -n "$existing_pr" ]]; then
            python3 - "$title" "$body_file" "$payload_file" <<'PY'
          import json
          import sys
          from pathlib import Path
          title, body_path, output_path = sys.argv[1:]
          Path(output_path).write_text(
              json.dumps({"title": title, "body": Path(body_path).read_text(encoding="utf-8")}),
              encoding="utf-8",
          )
          PY
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" \
              --input "$payload_file" >/dev/null
            update_status=$?
            if [[ $update_status -eq 0 ]]; then
              pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${existing_pr}"
            else
              failed=true
            fi
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "$title" \
              --body-file "$body_file")"
            create_status=$?
            if [[ $create_status -ne 0 ]]; then
              failed=true
              pr_url=''
            fi
          fi
          set -e

          if [[ "$failed" == true ]]; then
            echo "::warning::The token could not create/update a PR. Download the fallback artifact to review the exact snapshot and patch."
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # Pull requests created with GITHUB_TOKEN do not emit another
      # pull_request workflow run. Dispatch the same read-only quality workflow
      # explicitly for the bot branch; the complete suite already passed above.
      - name: Dispatch branch quality checks
        if: steps.propose_pr.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run quality-pages.yml --ref "$UPDATE_BRANCH"; then
            echo "::warning::Could not dispatch the follow-up quality run; all checks did pass inline in this update run."
          fi

      - name: Upload fallback patch when publishing a PR is unavailable
        if: >-
          steps.changes.outputs.changed == 'true' &&
          (steps.publish.outputs.published != 'true' || steps.propose_pr.outputs.failed == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-data-update-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-data-update
          if-no-files-found: error
          retention-days: 14

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.changes.outputs.changed }}" != 'true' ]]; then
            echo 'No upstream data changes were found.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.propose_pr.outputs.failed }}" == 'false' ]]; then
            echo "Review PR: ${{ steps.propose_pr.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A PR could not be published. Use the uploaded patch artifact for manual review.' >> "$GITHUB_STEP_SUMMARY"
          fi
